name: Release

# Déclenché par un tag de version, ex. v0.9.1
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # nécessaire pour créer la Release et y attacher les fichiers

jobs:
  release:
    runs-on: windows-latest   # WinForms self-contained win-x64 => build sous Windows obligatoire

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Restore
        run: dotnet restore AudioHexViewer.slnx

      - name: Test
        run: dotnet test AudioHexViewer.slnx -c Release --no-restore

      # Variante 1 : autonome (self-contained, runtime .NET embarqué)
      - name: Publish standalone (self-contained single-file)
        run: >
          dotnet publish AudioHexViewer/AudioHexViewer.csproj
          -c Release --no-restore
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-standalone

      # Variante 2 : légère (framework-dependent)
      - name: Publish runtime-required (framework-dependent single-file)
        run: >
          dotnet publish AudioHexViewer/AudioHexViewer.csproj
          -c Release --no-restore --self-contained false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-light

      - name: Package folders (exe + ContextHelp.json + doc) + SHA-256
        id: pkg
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"

          function Package($variant, $publishDir) {
            $base = "AudioHexViewer-v$ver-win-x64-$variant"
            $root = "$base/AudioHexViewer"                       # dossier à la racine du zip
            New-Item -ItemType Directory -Force -Path "$root/doc" | Out-Null

            Copy-Item "$publishDir/AudioHexViewer.exe" "$root/"  # l'exe seul (pas de .pdb ni .config)
            Copy-Item "AudioHexViewer/ContextHelp.json" "$root/" # les tooltips
            Copy-Item "AudioHexViewer/doc/*" "$root/doc/" -Recurse # la doc complète (html + img)

            $zip = "$base.zip"
            Compress-Archive -Force -Path $root -DestinationPath $zip
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            "$hash  $zip" | Out-File "$zip.sha256.txt" -Encoding ascii
            Write-Host "SHA-256 $zip = $hash"
            return $zip
          }

          $std  = Package "standalone"       "publish-standalone"
          $lite = Package "runtime-required" "publish-light"

          "std=$std"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "lite=$lite" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.std }}
            ${{ steps.pkg.outputs.std }}.sha256.txt
            ${{ steps.pkg.outputs.lite }}
            ${{ steps.pkg.outputs.lite }}.sha256.txt
          # v0.x ou tag pré-release (ex. v1.0.0-rc1) => marqué "pre-release"
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
