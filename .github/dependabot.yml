version: 2
updates:
  # Dépendances NuGet (NAudio, Math.NET, WinForms.DataVisualization, paquets de test…)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Versions des actions utilisées dans les workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
